name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # crear el GitHub Release de conduit

# No abortar un release a medias; serializar re-pushes del mismo tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # Fail-fast: si falta el PAT, abortar ANTES de que GoReleaser
      # publique el GitHub Release (evita el estado inconsistente
      # "Release publicado pero manifest no pusheado al bucket").
      - name: verify secrets
        env:
          TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SCOOP_BUCKET_TOKEN ausente — aborto antes de publicar el Release"
            exit 1
          fi

      # Actions pinneadas por SHA (este job tiene escritura cross-repo vía
      # PAT; un tag mutable comprometido sería un vector de supply-chain).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # GoReleaser necesita el historial/tags

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Release de conduit (este repo).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Push cross-repo del manifest a ShizukaJiku/scoop-bucket.
          # PAT fine-grained con Contents:RW SOLO sobre scoop-bucket.
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
